trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true
  displayName: 'Set up Python $(pythonVersion)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install flake8 pytest-cov
  displayName: 'Install Dependencies'

- script: |
    # Basic lint / syntax validation
    flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
  displayName: 'Code Quality Validation (Flake8)'

- script: |
    pytest --cov=app --cov-report=xml --cov-report=term
  displayName: 'Run Pytest Test Suite with Coverage'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/test-*.xml'
    testRunTitle: 'AI Room Image Analysis & Product Search Unit Tests'
  displayName: 'Publish Test Results'
